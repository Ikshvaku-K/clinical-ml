[project]
name = "clinical-ml"
version = "0.1.0"
description = "FHIR/EHR -> OMOP CDM warehouse and a calibrated, fairness-audited 30-day readmission model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow>=3.0",
    "matplotlib>=3.9",
    "shap>=0.54.1",
    "fairlearn>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Linux only (CI/Docker or the GPU node): the macOS wheel needs Homebrew's libomp.
benchmark = ["xgboost>=2.1"]
rag = [
    "bm25s>=0.3.16",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "pgserver>=0.1.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pystemmer>=3.1.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
clinical-ml = "clinical_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
